name: Pipeline PNCP (Extração e ETL)

on:
  workflow_dispatch:

  schedule:
    - cron: '23 9 * * *'

  push:
    branches:
      - main
    paths:
      - 'download_pncp.py'
      - 'pncp_etl.py'
      - 'test_pipeline.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  executar-pipeline:
    name: Extração e Processamento PNCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Executar Extração da API via Prefect (download_pncp.py)
        run: |
          python download_pncp.py

      - name: 2. Executar Transformação e Limpeza via Prefect (pncp_etl.py)
        run: |
          python pncp_etl.py

      - name: 3. Executar Testes e Validação de Qualidade de Dados (Pytest)
        run: |
          pytest -v

      - name: 4. Commitar e Enviar CSV Diretamente para o Repositório (Sem ZIP)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/editais_pncp_PB_PE.csv
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada na base de editais."
          else
            git commit -m "chore(data): atualizar editais_pncp_PB_PE.csv [skip ci]"
            git push
          fi

      - name: 5. Gerar Resumo da Execução no GitHub
        if: always()
        run: |
          echo "## Resumo da Execução do Pipeline PNCP" >> $GITHUB_STEP_SUMMARY
          echo "Data/Hora (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/editais_pncp_PB_PE.csv" ]; then
            TOTAL_EDITAIS=$(($(wc -l < data/editais_pncp_PB_PE.csv) - 1))
            echo "Status: Sucesso" >> $GITHUB_STEP_SUMMARY
            echo "Total de Editais Processados no CSV: **$TOTAL_EDITAIS**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "O arquivo **data/editais_pncp_PB_PE.csv** foi atualizado diretamente no repositório (arquivo .csv avulso, sem ZIP)." >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: Falha na geração dos arquivos." >> $GITHUB_STEP_SUMMARY
          fi
