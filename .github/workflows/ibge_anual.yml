name: Atualização Anual PIB IBGE (Novembro com Retry Diário)

on:
  workflow_dispatch:

  schedule:
    - cron: '37 12 8-22 11 *'

permissions:
  contents: write

jobs:
  atualizar-pib-ibge:
    name: Consultar API SIDRA IBGE (PIB e População)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Consultar API SIDRA do IBGE via Prefect (atualizar_ibge.py)
        run: |
          python atualizar_ibge.py

      - name: 2. Executar Testes e Validação de Qualidade de Dados (Pytest)
        run: |
          pytest -v

      - name: 3. Atualizar Dimensões IBGE no Neon Tech (load_db.py)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            python load_db.py
          else
            echo "[AVISO] Secret DATABASE_URL não configurado no GitHub. Etapa de carga no Neon ignorada."
          fi

      - name: 4. Commitar e Enviar caso o novo PIB tenha sido lançado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/dados_ibge_ufs.csv data/dados_ibge_municipios.csv
          if git diff --staged --quiet; then
            echo "Nenhum dado novo do IBGE publicado hoje. Nova verificação amanhã (se ainda dentro da janela de novembro)."
          else
            ANO_NOVO=$(head -n 2 data/dados_ibge_ufs.csv | tail -n 1 | cut -d';' -f1)
            git commit -m "chore(data): atualizar PIB IBGE com dados de $ANO_NOVO [skip ci]"
            git push
          fi

